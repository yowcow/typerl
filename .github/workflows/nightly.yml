name: Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
          - target: x86_64-apple-darwin
            os: macos-15-intel
            use-cross: false
          - target: aarch64-apple-darwin
            os: macos-15
            use-cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: nightly-${{ matrix.target }}
      - name: Install cross (aarch64-linux only)
        if: matrix.use-cross
        run: cargo install cross --version 0.2.5 --locked
      - name: Show runner arch
        run: uname -m && rustc -vV
      - name: Build (native)
        if: '!matrix.use-cross'
        run: cargo build --release --target ${{ matrix.target }}
      - name: Build (cross)
        if: matrix.use-cross
        run: cross build --release --target ${{ matrix.target }}
      - name: Stage uniquely named binary
        run: cp target/${{ matrix.target }}/release/typerl typerl-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: typerl-${{ matrix.target }}
          path: typerl-${{ matrix.target }}
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/typerl-*
